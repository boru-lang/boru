name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: lang/go/go.mod

      - name: Install golangci-lint
        # Use `go install` (Go is already on PATH from setup-go) rather
        # than the official action: `make lint` invokes the binary
        # directly so we just need it on PATH. The action insists on
        # running `golangci-lint run` itself, which we don't want here
        # — we run it ourselves later, against every module.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build CLI
        run: make -C cmd/go build

      - name: Vet (all modules)
        run: make vet

      - name: Lint assertions
        run: |
          make -C basic/go lint-assertions
          make -C lang/go lint-assertions

      - name: Lint (golangci-lint, all modules)
        run: make lint

      - name: Test (all modules)
        run: make test

      # ADR-008: 100% unit-test coverage of every reachable Go statement
      # across the merged cross-suite profile, the sole exclusion being the
      # reviewed allowlist of provably-unreachable defensive guards
      # (test/go/covergate/allowlist.tsv). Enforced here so the allowlist
      # can't silently drift as line numbers shift — the exact failure mode
      # that went unnoticed across the #236–#248 merge batch because no CI
      # step ran the gate (design/COVERAGE-ALLOWLIST.10.md).
      - name: Cover gate (ADR-008)
        run: make cover-gate

      # The STANDALONE gates: each piece covered by its OWN suite alone
      # (no cross-suite merge). core and parser are at the 100% contract;
      # check, compiler and eng carry ratchet floors that only ever rise.
      # parser starts AT 100 rather than on a ratchet because it is a leaf
      # over core — nothing else's suite could have been covering it, so
      # there was no incidental coverage to unwind. See design/legacy/ENG-FOUR-PIECE.0.ignore and
      # design/ENG-COVERAGE-PARITY.0.md.
      - name: Cover gate — core standalone (100%)
        run: make cover-gate-core

      - name: Cover gate — parser standalone (100%)
        run: make cover-gate-parser

      - name: Cover gate — check standalone (ratchet)
        run: make cover-gate-check

      - name: Cover gate — compiler standalone (ratchet)
        run: make cover-gate-compiler

      - name: Cover gate — eng standalone (ratchet)
        run: make cover-gate-eng

      # The TS half of the standalone-parity pair: typecheck + the suites
      # with their line-coverage ratchets (Go statements ≡ TS lines, both
      # measured source-only). core/ts runs FIRST and on its own — it is the
      # twin of `make cover-gate-core`, and running it before eng/ts is what
      # proves the core package really does stand alone: it has no dependency
      # on @boru-lang/eng, so a core file that reached upward would fail to
      # resolve here, before the engine is ever installed. Node >= 24 per the
      # packages' engines; npm ci restores the pinned toolchains.
      - name: Test eng/ts (typecheck + coverage ratchet)
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run TS gates (bottom-up: core, parser, then the engine)
        run: |
          ( cd core/ts && npm ci )
          make test-ts-core
          ( cd parser/ts && npm ci )
          make test-ts-parser
          ( cd eng/ts && npm ci )
          make test-ts

      # The parser twins, diffed row-for-row over eng/spec. Both dumpers
      # shipped with the TS port and nothing ever ran the comparison, which
      # is how three render defects lived in the gap between them — the
      # engine-level `crossdiff` cannot see a parser difference that still
      # evaluates alike (design/legacy/TS-PARITY-AUDIT.0.ignore).
      - name: Parser differential (parser/go vs parser/ts)
        run: make parser-crossdiff

      # The project knowledge graph (kg/) must stay in sync with the
      # sources that generate it: type-check the boru pipeline, run its
      # test suite, check the committed bundle's input digest against the
      # tree, rebuild, and fail if anything under kg/out drifts from the
      # rebuild — the "keep the graph updated with each PR" rule,
      # enforced. The build is deterministic, so an in-sync graph diffs
      # empty.
      #
      # `verify` is a strictly weaker check than the rebuild-and-diff
      # that follows it, and is run anyway for two reasons: it names the
      # input files that moved (a rebuild diff only shows the result),
      # and it keeps the verifier itself exercised in CI rather than
      # only on developer machines.
      - name: Knowledge graph (check, test, freshness)
        run: |
          make -C kg check
          make -C kg test
          make -C kg verify
          make -C kg graph
          git diff --exit-code kg/out

      # The bytecode compiler's correctness gates (differential,
      # whole-corpus parity, combination matrix, alloc ceilings) run as
      # part of `make test`. The race-detector gates do not, so run them
      # explicitly: a shared immutable Program driven across forks, the
      # island sub-engine reuse, and the concurrent spec rows in compiled
      # mode must be data-race-free.
      - name: Bytecode race gates
        run: |
          ( cd lang/go && go test . -run 'TestCompiledConcurrencyRaceFree|TestCompiledIslandReuseNoStateLeak' -race )
          ( cd test/go && go test ./langspec/ -run 'TestSpecCompiledConcurrentRowsRaceFree' -race )

      # The VM's hot path reuses one args buffer per run (eng/go/vm.go),
      # sound only while no compiled-reachable native retains its args slice.
      # -tags borudebug flips that buffer to a fresh allocation per call
      # (eng/go/vm_args_debug.go), so a retaining handler that would silently
      # corrupt a later dispatch in the release build instead diverges cleanly
      # here. Run the differential + combination + whole-corpus parity gates
      # under the tag so the invariant is guarded as compiled coverage grows.
      - name: Bytecode args-aliasing gate (borudebug)
        run: |
          ( cd lang/go && go test -tags borudebug . -run 'Bytecode|Compiled|Emit' )
          ( cd test/go && go test -tags borudebug ./langspec/ -run 'TestSpecCompiledDifferential|TestSpecCompiledOrFallback|TestCompiledCombinationParity' )

      - name: Build WASM
        run: make -C wpg wasm

      # Advisory: govulncheck currently flags Go standard-library vulns
      # that are fixed in newer 1.24.x patch releases — see
      # STATIC_ANALYSIS_REPORT.md. Drop continue-on-error once the `go`
      # directive is bumped (or CI installs the latest 1.24.x toolchain).
      - name: Vulncheck (advisory, all modules)
        run: make vuln
        continue-on-error: true

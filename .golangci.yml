# golangci-lint configuration (schema v2). Applies to all three Go modules
# in this repo — eng/go, lang, cmd/go — since golangci-lint walks up to the
# repo root to find this file. Run `make lint` (from lang/, eng/go/ or
# cmd/go/), which invokes `golangci-lint run ./...`.
#
# Deliberately conservative: the `standard` preset (errcheck, govet,
# ineffassign, staticcheck, unused) plus a few low-false-positive extras.
# Heavier or stylistic linters (gosec, revive, gocritic, nilerr, …) are
# left for opt-in / ad-hoc passes — see STATIC_ANALYSIS_REPORT.10.md.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose   # HTTP response bodies must be closed (cmd/go does http.Get)
    - misspell    # common misspellings in comments and strings
    - unconvert   # redundant type conversions
    # Complexity / duplication ratchets — thresholds are set just above
    # the worst current function so the gate is green today but a new
    # catastrophically-complex/duplicated function would fail it. See
    # STATIC_ANALYSIS_REPORT.10.md ("Complexity, size, duplication") for the
    # full hotspot list and the recommendation to ratchet these down.
    - gocyclo
    - gocognit
    - dupl
  settings:
    govet:
      # core.Value carries a zero-size noCopy marker, so copylocks reports
      # every by-value copy of a Value: tens of thousands today. Those are
      # counted against per-module ceilings by `make vet-copies` (the
      # no-copy ratchet, design/VALUE-NO-COPY.0.md phase 0), which is the
      # one place copylocks runs and which also fails on a copy of any
      # other lock. `go vet` in every Makefile runs -copylocks=false to
      # match.
      disable:
        - copylocks
    errcheck:
      # Calls where ignoring the error is the established convention.
      exclude-functions:
        - (*database/sql.Tx).Rollback
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
    staticcheck:
      # golangci-lint's default staticcheck set, plus drop the "QF"
      # quickfix *suggestions* (De Morgan rewrites, tagged-switch hints,
      # …) — fine in review, too noisy to gate CI on.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF*
    # gocyclo / gocognit / dupl thresholds (see comment near `enable`).
    # 2026-08-31 re-measure: MatchSignature's historical 87/211 exemption
    # recorded the pre-carve eng/go/match.go version; Stage 2's re-seat
    # (54d8830) cut it to 68/131, so its nolint is DELETED and the caps
    # bind on it for real. The one remaining nolint pair is eng vm.run
    # (148/278) — the VM instruction switch, which Stage 4 grows by design.
    gocyclo:
      min-complexity: 70    # worst non-exempt: DefTypedHandler (exactly 70 — passes, strictly-greater), execFnDefLiteral/Finalize (69)
    gocognit:
      min-complexity: 170   # worst non-exempt: check BuildFnBodyReturnsFn (165), core stepCloseParen (161)
    dupl:
      threshold: 400        # current 4 grandfathered groups are ≤ 350 tokens
  exclusions:
    generated: lax
    paths:
      # Vendored third-party source (github.com/rjrodger/patrun, MIT) — kept
      # verbatim except the gex-glob matcher; not ours to lint or restyle.
      - native/internal/patrun
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # Test code routinely discards setup errors (os.WriteFile, os.Chdir,
      # os.Setenv, …) and the spec-runner fixtures intentionally discard
      # the always-nil error from already-type-matched AsX() accessors.
      - path: _test\.go
        linters:
          - errcheck
          - ineffassign

formatters:
  enable:
    - gofmt

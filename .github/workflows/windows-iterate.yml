name: Windows iterate (temporary, branch-only)

# Scaffolding for fix/windows-portability: the Windows full suite on every
# push to that branch, so each fix is checked in one job rather than a whole
# daily build. Deleted before the branch's pull request.

on:
  push:
    branches: [fix/windows-portability]

jobs:
  full-suite:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: lang/go/go.mod
          cache: false
      - name: Full suite (go test -json)
        run: |
          rc=0
          for m in $(sed -n 's/^MODULES := //p' Makefile); do
            ( cd "$m" && go test -json -timeout 40m ./... ) >> full-suite.json 2>> full-suite.stderr || rc=1
          done
          exit $rc
      - name: Failing tests
        if: always()
        run: |
          jq -r 'select(.Action=="fail" and .Test != null and (.Test|contains("/")|not)) | "\(.Package) \(.Test)"' full-suite.json | sed 's|github.com/boru-lang/boru/||' | sort | uniq > failing.txt || true
          echo "failing top-level tests: $(wc -l < failing.txt)"
          cut -d' ' -f1 failing.txt | sort | uniq -c | sort -rn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-full-suite
          path: |
            full-suite.json
            full-suite.stderr
            failing.txt
          retention-days: 7

name: Daily build

# What runs once a day rather than on every push and pull request.
#
#   - The platform regressions on macOS and Windows (platforms.yml; ci.yml
#     runs the same job on Linux). They are the slowest runners to start
#     and to build on — a cold CLI build is a minute on Windows, and a
#     macOS runner can take most of a minute to be assigned — so they left
#     the PR path, which is held to three minutes a job.
#   - The full test suite natively on macOS and Windows (every module,
#     langspec included), where a PR runs only the platform regressions.
#   - The deep property fuzz (scripts/fuzz-daily.sh): both fuzzers at 20
#     seeds × 5000 programs from a seed base that moves every day, so each
#     day explores programs no earlier day generated. The report is in the
#     run's summary and its artifact.
#   - The suites too long for a PR: every RACE_MODULES package under the
#     race detector (a PR runs one race test), the generated syntax matrix
#     row by row (SPECGEN_FULL), and the TypeScript twins no PR runs — core,
#     basic, the engine port — with the cross-engine differential, which
#     skips wherever eng/ts is not installed and so never ran in CI before.
#     Each is a scripts/ci-steps.sh step, runnable locally.
#   - The report: every fuzz finding becomes a `fuzz` issue (one per
#     distinct shrunk program, never closed by a green day), and the
#     workflow keeps one `ci-health` issue, "Daily build is failing", open
#     while any job fails and closed when they pass again
#     (scripts/scheduled-issues.sh; AGENTS.md says how to act on them).
#
# The merged ADR-008 coverage gate is nightly too, in its own workflow
# (cover-gate.yml), with the same health issue.
#
# A pull request no longer exercises macOS or Windows, so a change to
# host-specific filesystem, terminal or credential code should run this on
# its branch before it merges:
#
#   gh workflow run daily.yml --ref <branch>
#
# Run by hand, seed-base replays a day (the base its report names) and
# selftest exercises the issue plumbing end to end, leaving nothing open.

on:
  schedule:
    # 04:41 UTC: off the hour, and clear of cover-gate.yml's 03:17.
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      seed-base:
        description: the fuzz seed base to replay (default today's, the UTC date × 100)
        required: false
        default: ''
      selftest:
        description: also run the issue plumbing's self-test
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  platform-regressions:
    uses: ./.github/workflows/platforms.yml
    with:
      os: '["macos-latest", "windows-latest"]'

  # No build cache: the setup action's cache paths are Linux's, and a cold
  # build once a day costs minutes nobody waits for.
  full-suite:
    name: Full suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: lang/go/go.mod
          cache: false
      - run: scripts/ci-steps.sh full-suite

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: race-modules
      - run: scripts/ci-steps.sh race-modules

  # Every row of every generated file (SPECGEN_FULL), in six parallel
  # slices: one runner takes longer than a job may (the exhaustive run is
  # 15 minutes on ten cores). Each slice verifies every sixth row, and the
  # six together every row exactly once (SPECGEN_SHARD, syntax_matrix_test.go).
  syntax-matrix:
    name: Syntax matrix (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      SPECGEN_SHARD: ${{ matrix.shard }}/6
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: syntax-matrix
      - run: scripts/ci-steps.sh syntax-matrix

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: 'true'
      - run: scripts/ci-steps.sh ts-suites

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The fuzzers live in the langspec package, so the shards' build
      # cache is this job's warm start.
      - uses: ./.github/actions/setup
        with:
          cache-name: test-langspec
      - name: Deep property fuzz from today's seeds
        run: scripts/fuzz-daily.sh fuzz-out
        env:
          BORU_FUZZ_SEED_BASE: ${{ inputs.seed-base }}
      - name: Report into the run summary
        if: always()
        run: cat fuzz-out/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-report
          path: fuzz-out
          if-no-files-found: ignore
          retention-days: 90

  # Issues speak for main only: a run on a branch (the dispatch above) is
  # that branch's own business, and its report is in its summary.
  report:
    needs: [platform-regressions, full-suite, fuzz, race, syntax-matrix, typescript]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      WORKFLOW: ${{ github.workflow }}
    steps:
      - uses: actions/checkout@v4
      # The fuzz job may have died before it uploaded; the health issue
      # below still reports it.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fuzz-report
          path: fuzz-out
      - name: File the fuzz findings
        run: scripts/scheduled-issues.sh findings fuzz-out/findings.jsonl
      - name: Daily build health issue
        run: scripts/scheduled-issues.sh health 'Daily build is failing' "$NEEDS"
        env:
          NEEDS: ${{ toJSON(needs) }}
      - name: Self-test the issue plumbing
        if: inputs.selftest
        run: scripts/scheduled-issues.sh selftest

name: CI

# The contract: every job under THREE MINUTES, so a push answers inside a
# coffee's worth of waiting and `make commit-gate` (the same ceiling, on
# what the change touched) is the developer's own copy of it. The layout
# that pays for it (design/legacy/FULL-COMPILATION-REVIEW.0.ignore §9):
#
#   - every step is defined ONCE, in scripts/ci-steps.sh, which `make
#     ci-local` runs in the same order — so running ci-local before a push
#     IS running CI, and nothing here can exist that the checklist misses;
#   - the jobs run in PARALLEL and each is small: the static checks, the
#     module suites split three ways (lang/go's root package alone is as
#     long as everything else), the langspec corpus in shards whose tests
#     walk the corpus on every core (test/go/langspec/walk_test.go) and run
#     in parallel with each other, the post-test gates split by what they
#     need installed, the race gate alone;
#   - the setup is per job: the composite action installs Node, the lint
#     or vuln tool, or builds the CLI only for the job that asks;
#   - the build caches are one generation deep: every green job saves a
#     fresh entry, and cache-cleanup.yml deletes the entries each run
#     superseded, so the 10 GB store never evicts main's warm ones;
#   - the platform regressions run natively on Linux here, and on macOS
#     and Windows once a day (daily.yml; both call platforms.yml): those
#     runners are the slowest to start and to build on — a cold CLI build
#     is a minute on Windows — and nothing on the PR path waits for them;
#   - the REGRESSION lane is what blocks: every gate in test/go/langspec
#     asserts its regression ceiling (a value that rose) by default. The
#     DIRECTION lane — the same gates against their END STATE
#     (type-soundness violations 0, …) — is red by design until the design's
#     end state is reached, so it is not a job: every shard
#     appends its gates' rows (BORU_GATE_SUMMARY) and the gate-table job
#     renders the one table into the run's summary, open rows and all.
#     (test/go/langspec/lanes_test.go is the rule; `make test-direction`
#     is the lane as a local run.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The Release workflow starts CI on main after it merges a release back:
  # its own push, made with the GITHUB_TOKEN, starts no workflow.
  workflow_dispatch:

jobs:
  # Refuse newly-added compiled binaries and oversized blobs. Cheap and
  # independent of the Go build, so it fails fast. Deleting a committed
  # binary later does NOT reclaim it — the blob stays in history and every
  # clone keeps paying — so the only real fix is never merging one.
  no-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history for the merge-base diff
      - name: No committed binaries or oversized files
        run: scripts/check-no-binaries.sh "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}"

  # The static checks: the committed knowledge graph matches the tree
  # (needs the CLI), vet, the assertion lint, golangci-lint over every
  # module in parallel with its cache warm from the last run.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          tools: lint
          build-cli: 'true'
      - run: scripts/ci-steps.sh kg-verify
      - run: scripts/ci-steps.sh vet
      - run: scripts/ci-steps.sh lint-assertions
      - run: scripts/ci-steps.sh lint

  # The no-copy ratchet (design/VALUE-NO-COPY.0.md, phase 0): every
  # module's copies of a core.Value, single and bulk, held to the ceilings
  # in tools/vetcopies/ceilings.tsv. The vet lanes above run without
  # copylocks, so this job is also the one that sees a copied sync.Mutex.
  vet-copies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: scripts/ci-steps.sh vet-copies

  # The module suites, three ways: the small modules together; lang/go
  # split into its root package and the rest; cmd/go with test/go's
  # non-corpus packages.
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: scripts/ci-steps.sh test-modules-core

  test-lang:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [root, rest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: test-lang-${{ matrix.part }}
      - run: scripts/ci-steps.sh test-module lang/go ${{ matrix.part }}

  test-cmd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: scripts/ci-steps.sh test-module cmd/go
      - run: scripts/ci-steps.sh test-module test/go

  # The langspec corpus, sharded by test name (test/go/langspec/shards.tsv;
  # TestLangspecShardsPartition keeps the file complete and disjoint). Keep
  # the matrix in step with `make langspec-shard-count`. Every shard
  # appends its gates' rows to a file the gate-table job collects. The
  # shards compile the same test binary, so they share ONE build cache:
  # the first to finish saves it, the rest find the key taken (nine
  # per-shard copies of the same objects were a third of every run's save).
  test-langspec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    env:
      BORU_GATE_SUMMARY: ${{ github.workspace }}/gate-status-${{ matrix.shard }}.md
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: test-langspec
      - name: Shard count matches this matrix
        run: |
          n=$(make -s langspec-shard-count)
          [ "$n" = "9" ] || { echo "shards.tsv defines $n shards; update the matrix in ci.yml"; exit 1; }
      - run: scripts/ci-steps.sh test-langspec ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-status-${{ matrix.shard }}
          path: gate-status-${{ matrix.shard }}.md
          if-no-files-found: ignore
          retention-days: 7

  # The gate table: the direction lane's deliverable, rendered from the
  # shards' rows into this run's summary. Never fails; an open row is the
  # programme's debt, a REGRESSION row already failed its shard.
  gate-table:
    runs-on: ubuntu-latest
    needs: test-langspec
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gate-status-*
          merge-multiple: true
          path: gate-status
      - name: Gate table
        run: scripts/ci-steps.sh gate-table gate-status/*.md | tee -a "$GITHUB_STEP_SUMMARY"

  # The parser parity (the TypeScript parser against the Go one) is the
  # one job that needs Node.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: 'true'
      - run: scripts/ci-steps.sh parser-parity

  # The post-test gates that need nothing installed but Go, and vuln.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          tools: vuln
      # core/go profiled by ITS OWN suite alone, floor 100. The merged
      # ADR-008 gate (make cover-gate) lives in cover-gate.yml (nightly and
      # workflow_dispatch) because re-profiling every module would dominate
      # every PR.
      - run: scripts/ci-steps.sh cover-gate-core
      - run: scripts/ci-steps.sh wasm
      # Advisory: govulncheck flags standard-library vulns fixed in newer
      # 1.24.x patch releases — see STATIC_ANALYSIS_REPORT.md.
      - run: scripts/ci-steps.sh vuln

  # The race gate builds the kernel under -race — a second compile — so it
  # is a job of its own rather than the gates job's long pole.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: scripts/ci-steps.sh race-gates

  # A current compiler and linter beside the pinned pair in `checks`: a new
  # Go release adds deprecation checks (reflect.Ptr for reflect.Pointer was
  # one) that the module's minimum Go and the pinned golangci-lint cannot
  # see, and the host-specific filesystem and terminal code is linted for
  # darwin and windows, which no ubuntu job compiles otherwise. Cold, the
  # lint runs long; the setup action's per-job cache brings it under the
  # ceiling once warm.
  lint-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          tools: lint
          go-version: stable
          # The release must decode the export data `stable` writes: Go
          # 1.27 writes version 5, which x/tools reads from v0.50.0 — the
          # release golangci-lint v2.14.0 vendors (v2.13.2's v0.49.0 stops
          # at 4, and failed every module's typecheck once stable moved).
          lint-version: v2.14.0
      - run: scripts/ci-steps.sh lint
      # The two targets lint side by side, as the module lint above does;
      # each one's output prints once both are done.
      - name: Lint the darwin and windows filesystem and terminal code
        working-directory: lang/go
        run: |
          pids=""
          for target_os in darwin windows; do
            GOOS="$target_os" golangci-lint run --allow-parallel-runners ./capabilities ./native \
              > "$RUNNER_TEMP/lint-$target_os.log" 2>&1 &
            pids="$pids $!"
          done
          rc=0
          for p in $pids; do wait "$p" || rc=1; done
          for target_os in darwin windows; do
            echo "==> GOOS=$target_os"; cat "$RUNNER_TEMP/lint-$target_os.log"
          done
          exit $rc

  # The native platform regressions (platforms.yml says what they are), on
  # Linux only. macOS and Windows run the same job once a day in daily.yml;
  # for a change to host-specific filesystem, terminal or credential code,
  # run it on the branch: `gh workflow run daily.yml --ref <branch>`.
  platform-regressions:
    uses: ./.github/workflows/platforms.yml
    with:
      os: '["ubuntu-latest"]'

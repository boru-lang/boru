name: CI

# The layout, and why (design/FULL-COMPILATION-REVIEW.0.md's velocity
# items 2, 3 and 5):
#
#   - every step is defined ONCE, in scripts/ci-steps.sh, which `make
#     ci-local` runs in the same order — so running ci-local before a push
#     IS running CI, and nothing here can exist that the checklist misses;
#   - the jobs run in PARALLEL, not as one 30-minute sequence: the checks,
#     the module suites, the langspec corpus in shards (test/go/langspec is
#     22 of those 30 minutes on its own), the post-test gates, and the
#     direction lane;
#   - the REGRESSION lane is what blocks: every gate in test/go/langspec
#     asserts its regression ceiling (a value that rose) by default. The
#     DIRECTION lane — the same gates against their END STATE (islands 0,
#     refusals 0, interpreter entries 0, …) — is red by design until the
#     full-compilation programme is done; it runs as its own job, never
#     fails the run, and renders the live gate table into the job summary
#     of every PR, so the debt is visible on every push without hiding a
#     regression behind it. (test/go/langspec/lanes_test.go is the rule.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Refuse newly-added compiled binaries and oversized blobs. Cheap and
  # independent of the Go build, so it fails fast. Deleting a committed
  # binary later does NOT reclaim it — the blob stays in history and every
  # clone keeps paying — so the only real fix is never merging one.
  no-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history for the merge-base diff
      - name: No committed binaries or oversized files
        run: scripts/check-no-binaries.sh "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}"

  # The static checks: the committed knowledge graph matches the tree, vet,
  # the assertion lint, golangci-lint over every module.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: scripts/ci-steps.sh kg-verify
      - run: scripts/ci-steps.sh vet
      - run: scripts/ci-steps.sh lint-assertions
      - run: scripts/ci-steps.sh lint

  # Every module's tests except the langspec corpus, which shards below.
  test-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: scripts/ci-steps.sh test-modules

  # The langspec corpus, sharded by test name (test/go/langspec/shards.tsv;
  # TestLangspecShardsPartition keeps the file complete and disjoint). Keep
  # the matrix in step with `make langspec-shard-count`.
  test-langspec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Shard count matches this matrix
        run: |
          n=$(make -s langspec-shard-count)
          [ "$n" = "4" ] || { echo "shards.tsv defines $n shards; update the matrix in ci.yml"; exit 1; }
      - run: scripts/ci-steps.sh test-langspec ${{ matrix.shard }}

  # The post-test gates, in parallel with the suites rather than after them.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: scripts/ci-steps.sh parser-parity
      # core/go profiled by ITS OWN suite alone, floor 100. The merged
      # ADR-008 gate (make cover-gate) lives in cover-gate.yml (nightly and
      # workflow_dispatch) because re-profiling 13 modules would dominate
      # every PR.
      - run: scripts/ci-steps.sh cover-gate-core
      - run: scripts/ci-steps.sh race-gates
      - run: scripts/ci-steps.sh borudebug-gates
      - run: scripts/ci-steps.sh wasm
      # Advisory: govulncheck flags standard-library vulns fixed in newer
      # 1.24.x patch releases — see STATIC_ANALYSIS_REPORT.md.
      - run: scripts/ci-steps.sh vuln

  # The direction lane: the langspec gates against their END STATE. Red by
  # design until the programme is done; never blocks; its table is the
  # deliverable, rendered into this job's summary.
  direction-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Direction gates (report only)
        continue-on-error: true
        run: scripts/ci-steps.sh direction-gates
      - name: Gate table
        if: always()
        run: |
          {
            echo "## Full-compilation gates — direction lane"
            echo
            echo "Every value against its END STATE (the design's number) and its REGRESSION ceiling (the last merged value; the blocking lanes assert it). Open rows are the programme's debt, not this PR's regression."
            echo
            echo "| gate | live | end state | regression ceiling | status | measures |"
            echo "|---|---:|---:|---:|---|---|"
            cat test/go/langspec/GATE_STATUS.md 2>/dev/null || echo "| (no gate ran) | | | | | |"
          } >> "$GITHUB_STEP_SUMMARY"
